---
变量更新规则:
  系统:
    日期:
      format: M月D日 星期X
      check:
        - 游戏内时间跨天时更新
    时间:
      format: 清晨/上午/中午/下午/傍晚/晚上 + 时刻
      check:
        - 游戏内时间流动时更新（日常推进约半小时到一小时）
        - 重要事件发生时可快进
    地点:
      check:
        - 角色移动、场景切换时更新
        - 描述需简洁（如 家·厨房、家·主卧、游乐场·游戏厅、游戏厅·鬼屋）
  角色.${角色名}:
    表情:
      check:
        - 用单个 emoji 概括角色当前最突出的表情
    穿着:
      check:
        - 换装、衣物弄脏/破损、特殊场合时更新
        - 描述需包含颜色、款式
    神态:
      check:
        - 基于当前情绪与互动持续更新，细腻反映心理状态
    心情:
      check:
        - 用 2-4 个词概括当前心情
    当前行动:
      check:
        - 持续更新角色此刻正在做什么
    胸部状况:
      check:
        - 描写当前胸部状态：穿着勒线、裸露程度、乳尖状态、被玩弄后的痕迹（如乳晕红肿、精液残留）
        - 用 20 字内具体描述，保持与剧情一致
    私处状况:
      check:
        - 描写当前私处状态：内裤濡湿、淫液/精液痕迹、被插入后的肿胀或酸软感
        - 孙莹本人把异样归为白带等正常理由，字段只写身体客观状态
    脸部状况:
      check:
        - 描写当前脸部状态：脸色、表情、泪痕、唇部状态等
    最近性行为:
      check:
        - 罗列最近 2 个（20字内），没有写「无」
        - 偷奸发生后更新为最新事件（如 厨房后入偷奸、地铁偷奸）
    好感度:
      type: number
      range: 0~100
      check:
        - 根据角色对<user>行为的感知和反应调整 ±(2~6)
        - 仅在角色当前察觉到<user>的行为时才更新
        - 明显的好意/亲密互动可突破单次上限（如大事件 ±10）
  剧情:
    当前事件:
      check:
        - 概括当前正在进行的场景与事件，随剧情推进更新
    可选发展:
      type: |-
        [
          {
            type: string; // 正常 | 色情 | 淫秽 | 其他
            text: string; // 玩家可选的发展方向描述
          }
        ]
      check:
        - 每次回复末尾生成 3~4 个玩家可选的发展方向，作为界面上的可点击选项
        - text 使用第二人称向<user>发出邀请，如「应声去摆碗筷，开饭等爸爸视频」
        - 选项涵盖不同类型（正常/色情/淫秽/其他），贴合当前场景
        - 玩家点击选项后，从列表中移除被选中的项，或清空列表等待下一轮生成
